name: CI

# Quality gates for the workspace. Every job is individually capped at ten
# minutes; the whole workflow is expected to finish well inside that budget on
# a warm cache. The `CI gate` job aggregates all required jobs so branch
# protection can require a single status check.
#
# Supply-chain policy: third-party actions are pinned to full commit SHAs
# (version in the trailing comment); cargo-deny and cargo-llvm-cov are pinned to
# exact releases by `taiki-e/install-action`. `dtolnay/rust-toolchain` is the
# exception: its ref selects the toolchain (`@stable`, or `@master` plus an
# explicit `toolchain:` input), so it is pinned by release tag/branch instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on branches/PRs, but never cancel a run on `main`:
# every commit that lands there must get a full, complete CI verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (all targets, all features, -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
      # Workspace lints already deny unsafe/unwrap/expect/panic; `-D warnings`
      # additionally promotes the existing `warn` lints (pedantic, float
      # arithmetic, indexing) to errors.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            toolchain: stable
          # Proves the MSRV declared in Cargo.toml (`rust-version = "1.85"`).
          - name: MSRV 1.85.0
            toolchain: 1.85.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-${{ matrix.toolchain }}
      - name: cargo test
        run: cargo test --workspace --all-targets --all-features --locked

  doc:
    name: Documentation (rustdoc, -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: doc
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  wasm:
    name: WASM build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm
      - name: cargo build (wasm32-unknown-unknown)
        run: cargo build -p fattura-core --target wasm32-unknown-unknown --locked

  deny:
    name: Supply chain (cargo-deny + core purity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # Pinned: the deny.toml schema is versioned with cargo-deny.
          tool: cargo-deny@0.20.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deny
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources
      - name: Core purity (no I/O, no floats, no C toolchain)
        run: bash scripts/check-core-purity.sh

  coverage:
    name: Coverage (100% lines/regions/functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
      - name: cargo llvm-cov
        run: >-
          cargo llvm-cov -p fattura-core --all-features --locked
          --fail-under-lines 100
          --fail-under-regions 100
          --fail-under-functions 100

  bench:
    name: Bench smoke build (cargo bench --no-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
      # Compiles the criterion harness so benchmark targets cannot rot.
      # Performance budgets themselves belong to E9.4.
      - name: cargo bench --no-run
        run: cargo bench -p fattura-core --locked --no-run

  gate:
    name: CI gate
    # Single status check for branch protection (E1.5). Fails unless every
    # required job completed successfully; skipped jobs do not mask failures.
    if: always()
    needs: [fmt, clippy, test, doc, wasm, deny, coverage, bench]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs did not succeed:" >&2
          echo '${{ toJSON(needs) }}' >&2
          exit 1
